services:
  postgres:
    image: postgres:16
    container_name: portfolio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_pipeline}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # O -d e obrigatorio: com apenas -U, a libpq assume que o banco tem o
      # mesmo nome do usuario e o servidor registra um FATAL "database
      # portfolio_user does not exist" a cada 5s. O pg_isready continua
      # devolvendo 0 (ele so testa se o servidor responde), entao o
      # healthcheck sempre passou -- mas o log ficava inutilizavel.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio_user} -d ${POSTGRES_DB:-portfolio_pipeline}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
